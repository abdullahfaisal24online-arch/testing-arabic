backend:
  name: github
  repo: abdullahfaisal24online-arch/testing-arabic
  branch: main

publish_mode: simple
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: courses
    label: "الدورات"
    label_singular: "دورة"
    folder: src/content/courses
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - name: title
        label: "اسم الدورة"
        widget: string
      - name: slug
        label: "الرابط بالإنجليزي بدون مسافات"
        widget: string
        hint: "مثال: qa-basics — بيصير رابط الدورة /courses/qa-basics/"
      - name: description
        label: "الوصف"
        widget: text
      - name: level
        label: "المستوى"
        widget: select
        default: "مبتدئ"
        options:
          - "مبتدئ"
          - "متوسط"
          - "متقدّم"
      - name: order
        label: "ترتيب الدورة بالصفحة"
        widget: number
        default: 1
        value_type: int
        min: 0
      - name: accent
        label: "اللون المميّز"
        widget: select
        default: cyan
        options:
          - cyan
          - orange
      - name: recommended
        label: "موصى فيها للبداية"
        widget: boolean
        default: false
      - name: outcomes
        label: "شو رح يتعلّم"
        widget: list
        required: false
        hint: "نقطة بكل سطر — بتظهر بصندوق بصفحة الدورة"
      - name: prerequisites
        label: "متطلبات سابقة"
        widget: list
        required: false
      - name: tags
        label: "الوسوم"
        widget: list
        required: false
      - name: cover
        label: "صورة الدورة"
        widget: image
        required: false
      - name: draft
        label: "مسودّة لا تُنشر"
        widget: boolean
        default: false
      - name: body
        label: "نص إضافي بصفحة الدورة"
        widget: markdown
        required: false

  - name: lessons
    label: "الدروس"
    label_singular: "درس"
    folder: src/content/lessons
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - name: title
        label: "عنوان الدرس"
        widget: string
      - name: slug
        label: "الرابط بالإنجليزي بدون مسافات"
        widget: string
        hint: "مثال: bug-report-that-works"
      - name: description
        label: "الوصف المختصر"
        widget: text
        hint: "سطر أو سطرين، هذا اللي بيظهر بنتائج البحث"
      - name: publishDate
        label: "تاريخ النشر"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - name: updatedDate
        label: "تاريخ التحديث"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
        required: false
      - name: category
        label: "التصنيف"
        widget: select
        default: "أساسيات"
        options:
          - "أساسيات"
          - "أتمتة"
          - "أدوات"
          - "Jira و Agile"
          - "مهارات"
      - name: level
        label: "المستوى"
        widget: select
        default: "مبتدئ"
        options:
          - "مبتدئ"
          - "متوسط"
          - "متقدّم"
      - name: duration
        label: "مدة الفيديو"
        widget: string
        default: "00:00"
        hint: "بصيغة MM:SS مثل 18:24"
      - name: videoId
        label: "معرّف الفيديو على Bunny"
        widget: string
        required: false
      - name: youtubeUrl
        label: "رابط النسخة على يوتيوب"
        widget: string
        required: false
      - name: thumbnail
        label: "صورة مصغّرة مخصّصة"
        widget: image
        required: false
      - name: course
        label: "الدورة"
        widget: relation
        collection: courses
        search_fields:
          - title
        value_field: slug
        display_fields:
          - title
        required: false
        hint: "اتركه فاضي إذا الدرس فيديو متفرّق مش ضمن دورة"
      - name: order
        label: "ترتيب الدرس داخل الدورة"
        widget: number
        default: 1
        value_type: int
        min: 0
      - name: lessonType
        label: "نوع الدرس"
        widget: select
        default: "شرح"
        options:
          - "شرح"
          - "عملي"
          - "مراجعة"
          - "أدوات"
      - name: tags
        label: "الوسوم"
        widget: list
        required: false
        hint: "كلمات مفتاحية مفصولة بفاصلة — مثال: تقرير خلل، جيرا"
      - name: summary
        label: "الخلاصة بنقاط"
        widget: list
        required: false
        hint: "نقطة بكل سطر — بتظهر بصندوق أعلى الشرح"
      - name: prerequisites
        label: "متطلبات سابقة"
        widget: list
        required: false
        hint: "شو لازم يكون عارفه قبل هذا الدرس"
      - name: relatedLessons
        label: "دروس مرتبطة"
        widget: relation
        collection: lessons
        multiple: true
        search_fields:
          - title
        value_field: slug
        display_fields:
          - title
        required: false
        hint: "اتركه فاضي والموقع بيقترح دروس من نفس التصنيف"
      - name: appUsed
        label: "التطبيق أو الأداة المستخدمة"
        widget: string
        required: false
        hint: "مثال: My Demo App v2.2.0"
      - name: exerciseTitle
        label: "عنوان التمرين"
        widget: string
        required: false
        hint: "اتركه فاضي ورح يظهر: طبّق اللي تعلّمته"
      - name: exercise
        label: "خطوات التمرين"
        widget: list
        required: false
        hint: "خطوة بكل سطر — بيظهر بصندوق برتقالي بنهاية الدرس"
      - name: exerciseNote
        label: "ملاحظة على التمرين"
        widget: string
        required: false
      - name: solution
        label: "خطوات الحل"
        widget: list
        required: false
        hint: "بتظهر خلف زر «اكشف الحل»"
      - name: solutionCode
        label: "كود الحل"
        widget: text
        required: false
        hint: "اختياري — بيظهر بصندوق كود"
      - name: resources
        label: "ملفات ومصادر"
        widget: list
        required: false
        summary: "{{fields.label}}"
        fields:
          - name: label
            label: "اسم الملف"
            widget: string
          - name: url
            label: "الرابط"
            widget: string
      - name: featured
        label: "درس مميّز يظهر بالواجهة"
        widget: boolean
        default: false
      - name: draft
        label: "مسودّة لا تُنشر"
        widget: boolean
        default: false
      - name: body
        label: "الشرح المكتوب"
        widget: markdown
        hint: "أهم جزء للسيو، اكتب هون نص الدرس والنقاط والأكواد"

  - name: articles
    label: "المقالات"
    label_singular: "مقال"
    folder: src/content/articles
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - name: title
        label: "عنوان المقال"
        widget: string
      - name: slug
        label: "الرابط بالإنجليزي بدون مسافات"
        widget: string
      - name: description
        label: "الوصف المختصر"
        widget: text
      - name: publishDate
        label: "تاريخ النشر"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - name: updatedDate
        label: "تاريخ التحديث"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
        required: false
      - name: category
        label: "التصنيف"
        widget: select
        default: "مهارات"
        options:
          - "مهارات"
          - "أدوات"
          - "أتمتة"
          - "قوالب"
          - "أساسيات"
      - name: tags
        label: "الوسوم"
        widget: list
        required: false
      - name: cover
        label: "صورة الغلاف"
        widget: image
        required: false
      - name: featured
        label: "مقال مميّز"
        widget: boolean
        default: false
      - name: draft
        label: "مسودّة لا تُنشر"
        widget: boolean
        default: false
      - name: body
        label: "نص المقال"
        widget: markdown

  - name: resources
    label: "الموارد والقوالب"
    label_singular: "مورد"
    folder: src/content/resources
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - name: title
        label: "اسم المورد"
        widget: string
      - name: slug
        label: "الرابط بالإنجليزي بدون مسافات"
        widget: string
        hint: "مثال: bug-report-template"
      - name: description
        label: "الوصف المختصر"
        widget: text
      - name: publishDate
        label: "تاريخ النشر"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - name: updatedDate
        label: "تاريخ التحديث"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
        required: false
      - name: category
        label: "النوع"
        widget: select
        default: "قوالب"
        options:
          - "قوالب"
          - "تشك ليست"
          - "تقارير"
          - "أدوات"
          - "أوراق مرجعية"
      - name: audience
        label: "لمين هذا المورد"
        widget: string
        required: false
      - name: format
        label: "صيغة الملف"
        widget: string
        required: false
        hint: "مثال: Markdown أو CSV أو PDF"
      - name: files
        label: "ملفات التحميل"
        widget: list
        summary: "{{fields.label}}"
        fields:
          - name: label
            label: "اسم الملف كما يظهر"
            widget: string
          - name: url
            label: "الملف"
            widget: file
            hint: "ارفع الملف أو الصق مساره مثل /resources/bug-report-template.md"
      - name: tags
        label: "الوسوم"
        widget: list
        required: false
      - name: cover
        label: "صورة"
        widget: image
        required: false
      - name: featured
        label: "مورد مميّز يظهر أولاً"
        widget: boolean
        default: false
      - name: draft
        label: "مسودّة لا تُنشر"
        widget: boolean
        default: false
      - name: body
        label: "شرح المورد وكيفية استعماله"
        widget: markdown

  - name: news
    label: "آخر الأخبار"
    label_singular: "خبر"
    folder: src/content/news
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - name: title
        label: "عنوان الخبر"
        widget: string
      - name: slug
        label: "الرابط بالإنجليزي بدون مسافات"
        widget: string
        hint: "مثال: new-course-maestro"
      - name: description
        label: "الوصف المختصر"
        widget: text
        required: false
      - name: publishDate
        label: "تاريخ النشر"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - name: cover
        label: "صورة الخبر"
        widget: image
        required: false
      - name: pinned
        label: "تثبيت بأعلى الأخبار"
        widget: boolean
        default: false
      - name: draft
        label: "مسودّة لا تُنشر"
        widget: boolean
        default: false
      - name: body
        label: "نص الخبر"
        widget: markdown

  - name: questions
    label: "بنك أسئلة المقابلات"
    label_singular: "سؤال"
    folder: src/content/questions
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - name: title
        label: "نص السؤال"
        widget: string
      - name: slug
        label: "الرابط بالإنجليزي بدون مسافات"
        widget: string
        hint: "مثال: severity-vs-priority"
      - name: level
        label: "المستوى"
        widget: select
        default: "مبتدئ"
        options:
          - "مبتدئ"
          - "متوسط"
          - "متقدّم"
      - name: domain
        label: "المجال"
        widget: select
        default: "أساسيات"
        options:
          - "أساسيات"
          - "يدوي"
          - "أتمتة"
          - "API"
          - "أدوات"
          - "إدارة الاختبار"
          - "سلوكي"
      - name: shortAnswer
        label: "الجواب المختصر"
        widget: text
        hint: "سطر أو سطرين — هذا اللي بينكشف بوضع التدريب"
      - name: tags
        label: "الوسوم"
        widget: list
        required: false
      - name: relatedLessons
        label: "دروس تشرح الموضوع"
        widget: relation
        collection: lessons
        multiple: true
        search_fields:
          - title
        value_field: slug
        display_fields:
          - title
        required: false
      - name: draft
        label: "مسودّة لا تُنشر"
        widget: boolean
        default: false
      - name: body
        label: "الشرح الكامل"
        widget: markdown
        hint: "ليش بينسأل، جواب نموذجي، والفخ الشائع"

  - name: glossary
    label: "قاموس المصطلحات"
    label_singular: "مصطلح"
    folder: src/content/glossary
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - name: title
        label: "المصطلح بالعربي"
        widget: string
      - name: slug
        label: "الرابط بالإنجليزي بدون مسافات"
        widget: string
        hint: "مثال: regression"
      - name: termEn
        label: "المصطلح بالإنجليزي"
        widget: string
        required: false
        hint: "مثال: Regression Testing"
      - name: description
        label: "تعريف بسطر واحد"
        widget: text
      - name: category
        label: "المجال"
        widget: select
        default: "أساسيات"
        options:
          - "أساسيات"
          - "أنواع الاختبار"
          - "إدارة الاختبار"
          - "أتمتة"
          - "أدوات"
      - name: aliases
        label: "كلمات بديلة"
        widget: list
        required: false
        hint: "الكلمات اللي بتنربط تلقائياً بمتن الدروس — مثال: ريجريشن، الريجريشن، Regression"
      - name: related
        label: "مصطلحات مرتبطة"
        widget: relation
        collection: glossary
        multiple: true
        search_fields:
          - title
        value_field: slug
        display_fields:
          - title
        required: false
      - name: draft
        label: "مسودّة لا تُنشر"
        widget: boolean
        default: false
      - name: body
        label: "الشرح الكامل"
        widget: markdown

  - name: pages
    label: "الصفحات"
    label_singular: "صفحة"
    folder: src/content/pages
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - name: title
        label: "عنوان الصفحة"
        widget: string
      - name: slug
        label: "الرابط بالإنجليزي بدون مسافات"
        widget: string
        hint: "مثال: about — بيصير رابط الصفحة /about/"
      - name: description
        label: "الوصف المختصر"
        widget: text
        required: false
      - name: order
        label: "الترتيب"
        widget: number
        default: 1
        value_type: int
        min: 0
        required: false
      - name: draft
        label: "مسودّة لا تُنشر"
        widget: boolean
        default: false
      - name: body
        label: "محتوى الصفحة"
        widget: markdown
        hint: "تقدر تحط نصوص وصور وعناوين — وحتى كود تضمين فيديو"

  - name: settings
    label: "إعدادات الموقع"
    files:
      - name: site
        label: "إعدادات عامة"
        file: src/content/settings/site.json
        fields:
          - name: name
            label: "اسم الموقع"
            widget: string
          - name: logoTop
            label: "الشعار — السطر الأول"
            widget: string
          - name: logoBottom
            label: "الشعار — السطر الثاني"
            widget: string
          - name: tagline
            label: "الجملة التعريفية"
            widget: string
          - name: description
            label: "وصف الموقع لمحركات البحث"
            widget: text
          - name: url
            label: "عنوان الموقع"
            widget: string
            hint: "مثال: https://testing-arabic.com — بدون شرطة مالحة بالآخر"
          - name: author
            label: "اسم صاحب المحتوى"
            widget: string
          - name: youtube
            label: "رابط قناة يوتيوب"
            widget: string
            required: false
          - name: linkedin
            label: "رابط لينكدإن"
            widget: string
            required: false
          - name: email
            label: "بريد التواصل"
            widget: string
            required: false
          - name: newsletterAction
            label: "رابط نموذج النشرة البريدية"
            widget: string
            required: false
            hint: "اتركه فاضي وقسم النشرة بينخفي من الموقع"
          - name: newsletterField
            label: "اسم حقل البريد بالنموذج"
            widget: string
            required: false
            default: email
            hint: "Buttondown: email — Kit: email_address"
          - name: newsletterHidden
            label: "حقول مخفية يطلبها المزوّد"
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - name: name
                label: "اسم الحقل"
                widget: string
              - name: value
                label: "القيمة"
                widget: string
            hint: "Buttondown بيطلب حقل embed قيمته 1"
          - name: bunnyLibraryId
            label: "رقم مكتبة Bunny Stream"
            widget: string
            required: false
          - name: bunnyCdnHostname
            label: "نطاق البث من Bunny"
            widget: string
            required: false
            hint: "مثال: vz-xxxxxxxx-xxx.b-cdn.net"
          - name: headerCtaLabel
            label: "نص زر الهيدر"
            widget: string
            required: false
          - name: headerCtaHref
            label: "رابط زر الهيدر"
            widget: string
            required: false
          - name: commentsEnabled
            label: "تفعيل التعليقات"
            widget: boolean
            default: false
            hint: "بتظهر بالدروس والمقالات والدورات فقط — مش بالأخبار"
          - name: commentsTitle
            label: "عنوان قسم التعليقات"
            widget: string
            required: false
            default: "النقاش"
          - name: commentsNote
            label: "الجملة فوق النموذج"
            widget: string
            required: false
          - name: commentsPlaceholder
            label: "النص داخل خانة التعليق"
            widget: string
            required: false
          - name: footerNote
            label: "جملة أسفل الموقع"
            widget: string
            required: false
          - name: nav
            label: "القائمة العلوية"
            widget: list
            summary: "{{fields.label}}"
            fields:
              - name: label
                label: "النص"
                widget: string
              - name: href
                label: "الرابط"
                widget: string
                hint: "مثال: /courses/ أو /news/ أو /about/"

      - name: home
        label: "الصفحة الرئيسية"
        file: src/content/settings/home.json
        fields:
          - name: heroEyebrow
            label: "الشارة الصغيرة فوق العنوان"
            widget: string
            required: false
          - name: heroTitle
            label: "العنوان الرئيسي"
            widget: string
          - name: heroHighlight
            label: "الكلمة المميّزة باللون السماوي"
            widget: string
            required: false
            hint: "لازم تكون كلمة موجودة حرفياً داخل العنوان الرئيسي"
          - name: heroSubtitle
            label: "النص تحت العنوان"
            widget: text
            required: false
          - name: primaryCtaLabel
            label: "الزر الأساسي — النص"
            widget: string
            required: false
          - name: primaryCtaHref
            label: "الزر الأساسي — الرابط"
            widget: string
            required: false
          - name: secondaryCtaLabel
            label: "الزر الثاني — النص"
            widget: string
            required: false
          - name: secondaryCtaHref
            label: "الزر الثاني — الرابط"
            widget: string
            required: false
          - name: showStats
            label: "إظهار الشريط تحت الأزرار"
            widget: boolean
            default: true
          - name: statsStyle
            label: "شكل الشريط"
            widget: select
            default: "قيم"
            options:
              - "قيم"
              - "أرقام"
