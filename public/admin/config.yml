      - name: announcements
        label: "شريط الأخبار"
        file: src/content/settings/announcements.json
        fields:
          - name: enabled
            label: "تشغيل الشريط"
            widget: boolean
            default: true
            hint: "بيطلع فوق كل صفحات الموقع (ما عدا صفحات الألعاب)"
          - name: interval
            label: "كل كم ثانية تتبدّل الرسالة"
            widget: number
            value_type: int
            min: 3
            max: 20
            default: 5
          - name: items
            label: "الرسائل"
            label_singular: "رسالة"
            widget: list
            required: false
            summary: "{{fields.text}}"
            hint: "رسالة وحدة بتطلع كل مرة. الزائر بيقدر يسكّر الشريط، وبيرجع يطلع لما تضيف رسالة جديدة"
            fields:
              - name: enabled
                label: "مفعّلة"
                widget: boolean
                default: true
              - name: text
                label: "النص"
                widget: string
                hint: "خليه قصير عشان يبين كامل عالموبايل — مثلاً: 🎮 جرّب لعبة Debug Hunt"
              - name: href
                label: "الرابط"
                widget: string
                required: false
                hint: "مثلاً /debug-hunt/ — فاضي = رسالة بدون رابط"
              - name: badge
                label: "الشارة"
                widget: string
                required: false
                hint: "كلمة وحدة بتطلع جنب النص (جديد، حصري…). فاضية = بدون شارة"
              - name: tone
                label: "لون الشارة"
                widget: select
                default: "orange"
                options:
                  - { label: "برتقالي", value: "orange" }
                  - { label: "أزرق", value: "cyan" }
              - name: start
                label: "تبدأ تظهر من"
                widget: datetime
                required: false
                format: "YYYY-MM-DD"
                date_format: "YYYY-MM-DD"
                time_format: false
                picker_utc: true
                hint: "فاضي = من هسا"
              - name: end
                label: "بتختفي بعد"
                widget: datetime
                required: false
                format: "YYYY-MM-DD"
                date_format: "YYYY-MM-DD"
                time_format: false
                picker_utc: true
                hint: "فاضي = بتضل لحد ما توقفها"

      - name: start
        label: "صفحة ابدأ من هنا"
        file: src/content/settings/start.json
        fields:
          - name: title
            label: "عنوان الصفحة"
            widget: string
          - name: intro
            label: "المقدّمة"
            widget: text
            required: false
          - name: note
            label: "نصيحة بأسفل الصفحة"
            widget: text
            required: false
          - name: stages
            label: "المراحل"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - name: label
                label: "ترقيم المرحلة"
                widget: string
                required: false
                hint: "مثال: المرحلة الأولى"
              - name: title
                label: "عنوان المرحلة"
                widget: string
              - name: body
                label: "شرح المرحلة"
                widget: text
              - name: items
                label: "روابط المرحلة"
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - name: label
                    label: "النص"
                    widget: string
                  - name: href
                    label: "الرابط"
                    widget: string
                    hint: "مثال: /courses/qa-basics/"
                  - name: kind
                    label: "النوع"
                    widget: string
                    required: false
                    hint: "دورة / درس / قالب / مقال"

      - name: chat
        label: "مساعد Testo"
        file: src/content/settings/chat.json
        fields:
          - name: enabled
            label: "تشغيل المساعد على الموقع"
            widget: boolean
            default: true
            hint: "أطفئه لو بدك تخفي Testo من الموقع مؤقتاً"
          - name: model
            label: "الموديل"
            widget: select
            default: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
            options:
              - label: "الأقوى بالعربي — Llama 3.3 70B"
                value: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
              - label: "الأسرع والأخف — Llama 3.1 8B"
                value: "@cf/meta/llama-3.1-8b-instruct-fast"
            hint: "لو حسّيت استهلاك عالي أو بطء، جرّب الأخف"
          - name: instructions
            label: "تعليمات وشخصية إضافية"
            widget: text
            required: false
            hint: "بتتراكم فوق القواعد الأساسية المقفلة (يجاوب QA فقط، ما يقول ما بعرف، يرفض البرّا). اكتب هون نبرته أو أي توجيهات إضافية."
          - name: welcome
            label: "رسالة الترحيب"
            widget: text
            required: false
            hint: "أول رسالة بتظهر لما يفتح الزائر المساعد. اتركها فاضية وبتظهر الرسالة الافتراضية."
          - name: maxTokens
            label: "أقصى طول للرد"
            widget: number
            default: 512
            value_type: int
            min: 128
            max: 1024
            hint: "كل ما زاد الرقم صار الرد أطول واستهلك أكثر — 512 مناسب"
          - name: perHour
            label: "عدد الرسائل المسموحة لكل زائر بالساعة"
            widget: number
            default: 15
            value_type: int
            min: 1
            hint: "حماية من الاستهلاك الزائد"
          - name: limitMessage
            label: "رسالة الوصول للحد"
            widget: text
            required: false
            hint: "اتركها فاضية وبتظهر الرسالة الافتراضية"
