backend:
  name: github
  repo: abdullahfaisal24online-arch/testing-arabic
  branch: main

publish_mode: simple
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: lessons
    label: "الدروس"
    label_singular: "درس"
    folder: src/content/lessons
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - name: title
        label: "عنوان الدرس"
        widget: string
      - name: slug
        label: "الرابط بالإنجليزي بدون مسافات"
        widget: string
        hint: "مثال: bug-report-that-works"
      - name: description
        label: "الوصف المختصر"
        widget: text
        hint: "سطر أو سطرين، هذا اللي بيظهر بنتائج البحث"
      - name: publishDate
        label: "تاريخ النشر"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - name: updatedDate
        label: "تاريخ التحديث"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
        required: false
      - name: category
        label: "التصنيف"
        widget: select
        default: "أساسيات"
        options:
          - "أساسيات"
          - "أتمتة"
          - "أدوات"
          - "Jira و Agile"
          - "مهارات"
      - name: level
        label: "المستوى"
        widget: select
        default: "مبتدئ"
        options:
          - "مبتدئ"
          - "متوسط"
          - "متقدّم"
      - name: duration
        label: "مدة الفيديو"
        widget: string
        default: "00:00"
        hint: "بصيغة MM:SS مثل 18:24"
      - name: videoId
        label: "معرّف الفيديو على Bunny"
        widget: string
        required: false
      - name: youtubeUrl
        label: "رابط النسخة على يوتيوب"
        widget: string
        required: false
      - name: thumbnail
        label: "صورة مصغّرة مخصّصة"
        widget: image
        required: false
      - name: track
        label: "المسار التعليمي"
        widget: relation
        collection: tracks
        search_fields:
          - title
        value_field: slug
        display_fields:
          - title
        required: false
      - name: order
        label: "ترتيب الدرس داخل المسار"
        widget: number
        default: 1
        value_type: int
        min: 0
      - name: resources
        label: "ملفات ومصادر"
        widget: list
        required: false
        summary: "{{fields.label}}"
        fields:
          - name: label
            label: "اسم الملف"
            widget: string
          - name: url
            label: "الرابط"
            widget: string
      - name: featured
        label: "درس مميّز يظهر بالواجهة"
        widget: boolean
        default: false
      - name: draft
        label: "مسودّة لا تُنشر"
        widget: boolean
        default: false
      - name: body
        label: "الشرح المكتوب"
        widget: markdown
        hint: "أهم جزء للسيو، اكتب هون نص الدرس والنقاط والأكواد"

  - name: articles
    label: "المقالات"
    label_singular: "مقال"
    folder: src/content/articles
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - name: title
        label: "عنوان المقال"
        widget: string
      - name: slug
        label: "الرابط بالإنجليزي بدون مسافات"
        widget: string
      - name: description
        label: "الوصف المختصر"
        widget: text
      - name: publishDate
        label: "تاريخ النشر"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - name: updatedDate
        label: "تاريخ التحديث"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
        required: false
      - name: category
        label: "التصنيف"
        widget: select
        default: "مهارات"
        options:
          - "مهارات"
          - "أدوات"
          - "أتمتة"
          - "قوالب"
          - "أساسيات"
      - name: cover
        label: "صورة الغلاف"
        widget: image
        required: false
      - name: featured
        label: "مقال مميّز"
        widget: boolean
        default: false
      - name: draft
        label: "مسودّة لا تُنشر"
        widget: boolean
        default: false
      - name: body
        label: "نص المقال"
        widget: markdown

  - name: tracks
    label: "المسارات"
    label_singular: "مسار"
    folder: src/content/tracks
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - name: title
        label: "اسم المسار"
        widget: string
      - name: slug
        label: "الرابط بالإنجليزي بدون مسافات"
        widget: string
      - name: description
        label: "الوصف"
        widget: text
      - name: level
        label: "المستوى"
        widget: select
        default: "مبتدئ"
        options:
          - "مبتدئ"
          - "متوسط"
          - "متقدّم"
      - name: order
        label: "ترتيب المسار بالصفحة"
        widget: number
        default: 1
        value_type: int
        min: 0
      - name: accent
        label: "اللون المميّز"
        widget: select
        default: cyan
        options:
          - cyan
          - orange
      - name: recommended
        label: "موصى فيه للبداية"
        widget: boolean
        default: false
      - name: draft
        label: "مسودّة لا تُنشر"
        widget: boolean
        default: false
      - name: body
        label: "نص إضافي بصفحة المسار"
        widget: markdown
        required: false

  - name: pages
    label: "الصفحات"
    label_singular: "صفحة"
    folder: src/content/pages
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - name: title
        label: "عنوان الصفحة"
        widget: string
      - name: slug
        label: "الرابط بالإنجليزي بدون مسافات"
        widget: string
        hint: "مثال: about — بيصير رابط الصفحة /about/"
      - name: description
        label: "الوصف المختصر"
        widget: text
        required: false
      - name: order
        label: "الترتيب"
        widget: number
        default: 1
        value_type: int
        min: 0
        required: false
      - name: draft
        label: "مسودّة لا تُنشر"
        widget: boolean
        default: false
      - name: body
        label: "محتوى الصفحة"
        widget: markdown
        hint: "تقدر تحط نصوص وصور وعناوين — وحتى كود تضمين فيديو"

  - name: settings
    label: "إعدادات الموقع"
    files:
      - name: site
        label: "إعدادات عامة"
        file: src/content/settings/site.json
        fields:
          - name: name
            label: "اسم الموقع"
            widget: string
          - name: logoTop
            label: "الشعار — السطر الأول"
            widget: string
          - name: logoBottom
            label: "الشعار — السطر الثاني"
            widget: string
          - name: tagline
            label: "الجملة التعريفية"
            widget: string
          - name: description
            label: "وصف الموقع لمحركات البحث"
            widget: text
          - name: url
            label: "عنوان الموقع"
            widget: string
            hint: "مثال: https://testing-arabic.com — بدون شرطة مالحة بالآخر"
          - name: author
            label: "اسم صاحب المحتوى"
            widget: string
          - name: youtube
            label: "رابط قناة يوتيوب"
            widget: string
            required: false
          - name: linkedin
            label: "رابط لينكدإن"
            widget: string
            required: false
          - name: email
            label: "بريد التواصل"
            widget: string
            required: false
          - name: newsletterAction
            label: "رابط نموذج النشرة البريدية"
            widget: string
            required: false
            hint: "اتركه فاضي وقسم النشرة بينخفي من الموقع"
          - name: bunnyLibraryId
            label: "رقم مكتبة Bunny Stream"
            widget: string
            required: false
          - name: bunnyCdnHostname
            label: "نطاق البث من Bunny"
            widget: string
            required: false
            hint: "مثال: vz-xxxxxxxx-xxx.b-cdn.net"
          - name: headerCtaLabel
            label: "نص زر الهيدر"
            widget: string
            required: false
          - name: headerCtaHref
            label: "رابط زر الهيدر"
            widget: string
            required: false
          - name: footerNote
            label: "جملة أسفل الموقع"
            widget: string
            required: false
          - name: nav
            label: "القائمة العلوية"
            widget: list
            summary: "{{fields.label}}"
            fields:
              - name: label
                label: "النص"
                widget: string
              - name: href
                label: "الرابط"
                widget: string
                hint: "مثال: /tracks/ أو /about/"

      - name: home
        label: "الصفحة الرئيسية"
        file: src/content/settings/home.json
        fields:
          - name: heroEyebrow
            label: "الشارة الصغيرة فوق العنوان"
            widget: string
            required: false
          - name: heroTitle
            label: "العنوان الرئيسي"
            widget: string
          - name: heroHighlight
            label: "الكلمة المميّزة باللون السماوي"
            widget: string
            required: false
            hint: "لازم تكون كلمة موجودة داخل العنوان الرئيسي"
          - name: heroSubtitle
            label: "النص تحت العنوان"
            widget: text
            required: false
          - name: primaryCtaLabel
            label: "الزر الأساسي — النص"
            widget: string
            required: false
          - name: primaryCtaHref
            label: "الزر الأساسي — الرابط"
            widget: string
            required: false
          - name: secondaryCtaLabel
            label: "الزر الثاني — النص"
            widget: string
            required: false
          - name: secondaryCtaHref
            label: "الزر الثاني — الرابط"
            widget: string
            required: false
          - name: showStats
            label: "إظهار أرقام الإحصائيات"
            widget: boolean
            default: true
          - name: statLessonsLabel
            label: "وصف رقم الدروس"
            widget: string
            required: false
          - name: statTracksLabel
            label: "وصف رقم المسارات"
            widget: string
            required: false
          - name: statArticlesLabel
            label: "وصف رقم المقالات"
            widget: string
            required: false
          - name: showFeatured
            label: "إظهار بطاقة الدرس المميّز"
            widget: boolean
            default: true
          - name: featuredBadge
            label: "شارة البطاقة المميّزة"
            widget: string
            required: false
          - name: featuredCta
            label: "نص رابط البطاقة المميّزة"
            widget: string
            required: false
          - name: showTracks
            label: "إظهار قسم المسارات"
            widget: boolean
            default: true
          - name: tracksEyebrow
            label: "قسم المسارات — الشارة"
            widget: string
            required: false
          - name: tracksTitle
            label: "قسم المسارات — العنوان"
            widget: string
            required: false
          - name: tracksSubtitle
            label: "قسم المسارات — النص"
            widget: text
            required: false
          - name: showLessons
            label: "إظهار قسم أحدث الدروس"
            widget: boolean
            default: true
          - name: lessonsTitle
            label: "قسم الدروس — العنوان"
            widget: string
            required: false
          - name: showArticles
            label: "إظهار قسم المقالات"
            widget: boolean
            default: true
          - name: articlesTitle
            label: "قسم المقالات — العنوان"
            widget: string
            required: false
          - name: newsletterTitle
            label: "قسم النشرة — العنوان"
            widget: string
            required: false
          - name: newsletterText
            label: "قسم النشرة — النص"
            widget: text
            required: false
          - name: newsletterButton
            label: "قسم النشرة — نص الزر"
            widget: string
            required: false
          - name: newsletterNote
            label: "قسم النشرة — الملاحظة الصغيرة"
            widget: string
            required: false
