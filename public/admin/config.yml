backend:
  name: github
  repo: abdullahfaisal24online-arch/testing-arabic
  branch: main

publish_mode: simple
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: products
    label: "المنتجات المدفوعة"
    label_singular: "منتج"
    folder: src/content/products
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - name: title
        label: "اسم المنتج"
        widget: string
      - name: slug
        label: "الرابط بالإنجليزي بدون مسافات"
        widget: string
        hint: "مثال: ctfl-questions — صفحة البيع بتصير /store/ctfl-questions/ والمحتوى المدفوع /pro/ctfl-questions/"
      - name: kind
        label: "النوع"
        widget: select
        default: "بنك أسئلة"
        options:
          - "بنك أسئلة"
          - "ملخصات"
          - "قوالب"
          - "دورة"
          - "حزمة"
      - name: pitch
        label: "سطر واحد يشرح المادة"
        widget: string
        required: false
      - name: price
        label: "السعر بالدينار"
        widget: number
        default: 29
        value_type: float
        min: 0
      - name: offerPrice
        label: "سعر العرض بالدينار"
        widget: number
        required: false
        value_type: float
        min: 0
        hint: "اتركه فاضي إذا ما في عرض"
      - name: offerNote
        label: "جملة العرض"
        widget: string
        required: false
        hint: "مثال: لأول ٥٠ مشترك"
      - name: includes
        label: "شو جواها"
        widget: list
        required: false
        hint: "نقطة بكل سطر — بتظهر بصفحة البيع"
      - name: course
        label: "الدورة اللي بيفتحها هاد المنتج"
        widget: string
        required: false
        hint: "slug الدورة زي ما هو بقسم الدورات — اتركه فاضي لغير الدورات"
      - name: bundleOf
        label: "المنتجات داخل الحزمة"
        widget: list
        required: false
        hint: "slug كل منتج بتفتحه الحزمة — للحزم فقط"
      - name: sampleHref
        label: "رابط النموذج المجاني"
        widget: string
        required: false
      - name: cover
        label: "صورة المنتج"
        widget: image
        required: false
      - name: order
        label: "الترتيب بالمتجر"
        widget: number
        default: 1
        value_type: int
        min: 0
      - name: featured
        label: "مميّز بالمتجر"
        widget: boolean
        default: false
      - name: draft
        label: "مسودّة لا تُنشر"
        widget: boolean
        default: false
      - name: body
        label: "الوصف الكامل بصفحة البيع"
        widget: markdown
        required: false
  - name: courses
    label: "الدورات"
    label_singular: "دورة"
    folder: src/content/courses
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - name: title
        label: "اسم الدورة"
        widget: string
      - name: slug
        label: "الرابط بالإنجليزي بدون مسافات"
        widget: string
        hint: "مثال: qa-basics — بيصير رابط الدورة /courses/qa-basics/"
      - name: description
        label: "الوصف"
        widget: text
      - name: level
        label: "المستوى"
        widget: select
        default: "مبتدئ"
        options:
          - "مبتدئ"
          - "متوسط"
          - "متقدّم"
      - name: order
        label: "ترتيب الدورة بالصفحة"
        widget: number
        default: 1
        value_type: int
        min: 0
      - name: accent
        label: "اللون المميّز"
        widget: select
        default: cyan
        options:
          - cyan
          - orange
      - name: recommended
        label: "موصى فيها للبداية"
        widget: boolean
        default: false
      - name: certificateEnabled
        label: "تمنح شهادة إتمام"
        widget: boolean
        default: false
        hint: "فعّلها فقط للدورات اللي بدك تمنح عليها شهادة بعد مشاهدة 90% من كل فيديو."
      - name: certificateTitleEn
        label: "اسم الدورة بالإنجليزي على الشهادة"
        widget: string
        required: false
        hint: "مطلوب عند تفعيل الشهادة، مثال: Software Testing Fundamentals"
      - name: outcomes
        label: "شو رح يتعلّم"
        widget: list
        required: false
        hint: "نقطة بكل سطر — بتظهر بصندوق بصفحة الدورة"
      - name: prerequisites
        label: "متطلبات سابقة"
        widget: list
        required: false
      - name: tags
        label: "الوسوم"
        widget: list
        required: false
      - name: cover
        label: "صورة الدورة"
        widget: image
        required: false
      - name: draft
        label: "مسودّة لا تُنشر"
        widget: boolean
        default: false
      - name: body
        label: "نص إضافي بصفحة الدورة"
        widget: markdown
        required: false

  - name: lessons
    label: "الدروس"
    label_singular: "درس"
    folder: src/content/lessons
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - name: title
        label: "عنوان الدرس"
        widget: string
      - name: slug
        label: "الرابط بالإنجليزي بدون مسافات"
        widget: string
        hint: "مثال: bug-report-that-works"
      - name: description
        label: "الوصف المختصر"
        widget: text
        hint: "سطر أو سطرين، هذا اللي بيظهر بنتائج البحث"
      - name: publishDate
        label: "تاريخ النشر"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - name: updatedDate
        label: "تاريخ التحديث"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
        required: false
      - name: category
        label: "التصنيف"
        widget: select
        default: "أساسيات"
        options:
          - "أساسيات"
          - "أتمتة"
          - "أدوات"
          - "Jira و Agile"
          - "مهارات"
      - name: level
        label: "المستوى"
        widget: select
        default: "مبتدئ"
        options:
          - "مبتدئ"
          - "متوسط"
          - "متقدّم"
      - name: duration
        label: "مدة الفيديو"
        widget: string
        default: "00:00"
        hint: "بصيغة MM:SS مثل 18:24"
      - name: videoId
        label: "معرّف الفيديو على Bunny"
        widget: string
        required: false
      - name: youtubeUrl
        label: "رابط النسخة على يوتيوب"
        widget: string
        required: false
      - name: thumbnail
        label: "صورة مصغّرة مخصّصة"
        widget: image
        required: false
      - name: course
        label: "الدورة"
        widget: relation
        collection: courses
        search_fields:
          - title
        value_field: slug
        display_fields:
          - title
        required: false
        hint: "اتركه فاضي إذا الدرس فيديو متفرّق مش ضمن دورة"
      - name: order
        label: "ترتيب الدرس داخل الدورة"
        widget: number
        default: 1
        value_type: int
        min: 0
      - name: lessonType
        label: "نوع الدرس"
        widget: select
        default: "شرح"
        options:
          - "شرح"
          - "عملي"
          - "مراجعة"
          - "أدوات"
      - name: tags
        label: "الوسوم"
        widget: list
        required: false
        hint: "كلمات مفتاحية مفصولة بفاصلة — مثال: تقرير خلل، جيرا"
      - name: summary
        label: "الخلاصة بنقاط"
        widget: list
        required: false
        hint: "نقطة بكل سطر — بتظهر بصندوق أعلى الشرح"
      - name: prerequisites
        label: "متطلبات سابقة"
        widget: list
        required: false
        hint: "شو لازم يكون عارفه قبل هذا الدرس"
      - name: relatedLessons
        label: "دروس مرتبطة"
        widget: relation
        collection: lessons
        multiple: true
        search_fields:
          - title
        value_field: slug
        display_fields:
          - title
        required: false
        hint: "اتركه فاضي والموقع بيقترح دروس من نفس التصنيف"
      - name: appUsed
        label: "التطبيق أو الأداة المستخدمة"
        widget: string
        required: false
        hint: "مثال: My Demo App v2.2.0"
      - name: exerciseTitle
        label: "عنوان التمرين"
        widget: string
        required: false
        hint: "اتركه فاضي ورح يظهر: طبّق اللي تعلّمته"
      - name: exercise
        label: "خطوات التمرين"
        widget: list
        required: false
        hint: "خطوة بكل سطر — بيظهر بصندوق برتقالي بنهاية الدرس"
      - name: exerciseNote
        label: "ملاحظة على التمرين"
        widget: string
        required: false
      - name: solution
        label: "خطوات الحل"
        widget: list
        required: false
        hint: "بتظهر خلف زر «اكشف الحل»"
      - name: solutionCode
        label: "كود الحل"
        widget: text
        required: false
        hint: "اختياري — بيظهر بصندوق كود"
      - name: resources
        label: "ملفات ومصادر"
        widget: list
        required: false
        summary: "{{fields.label}}"
        fields:
          - name: label
            label: "اسم الملف"
            widget: string
          - name: url
            label: "الرابط"
            widget: string
      - name: featured
        label: "درس مميّز يظهر بالواجهة"
        widget: boolean
        default: false
      - name: draft
        label: "مسودّة لا تُنشر"
        widget: boolean
        default: false
      - name: body
        label: "الشرح المكتوب"
        widget: markdown
        hint: "أهم جزء للسيو، اكتب هون نص الدرس والنقاط والأكواد"

  - name: articles
    label: "المقالات"
    label_singular: "مقال"
    folder: src/content/articles
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - name: title
        label: "عنوان المقال"
        widget: string
      - name: slug
        label: "الرابط بالإنجليزي بدون مسافات"
        widget: string
      - name: description
        label: "الوصف المختصر"
        widget: text
      - name: publishDate
        label: "تاريخ النشر"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - name: updatedDate
        label: "تاريخ التحديث"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
        required: false
      - name: category
        label: "التصنيف"
        widget: select
        default: "مهارات"
        options:
          - "مهارات"
          - "أدوات"
          - "أتمتة"
          - "قوالب"
          - "أساسيات"
      - name: tags
        label: "الوسوم"
        widget: list
        required: false
      - name: cover
        label: "صورة الغلاف"
        widget: image
        required: false
      - name: featured
        label: "مقال مميّز"
        widget: boolean
        default: false
      - name: draft
        label: "مسودّة لا تُنشر"
        widget: boolean
        default: false
      - name: body
        label: "نص المقال"
        widget: markdown

  - name: resources
    label: "الموارد والقوالب"
    label_singular: "مورد"
    folder: src/content/resources
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - name: title
        label: "اسم المورد"
        widget: string
      - name: slug
        label: "الرابط بالإنجليزي بدون مسافات"
        widget: string
        hint: "مثال: bug-report-template"
      - name: description
        label: "الوصف المختصر"
        widget: text
      - name: publishDate
        label: "تاريخ النشر"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - name: updatedDate
        label: "تاريخ التحديث"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
        required: false
      - name: category
        label: "النوع"
        widget: select
        default: "قوالب"
        options:
          - "قوالب"
          - "تشك ليست"
          - "تقارير"
          - "أدوات"
          - "أوراق مرجعية"
      - name: audience
        label: "لمين هذا المورد"
        widget: string
        required: false
      - name: format
        label: "صيغة الملف"
        widget: string
        required: false
        hint: "مثال: Markdown أو CSV أو PDF"
      - name: files
        label: "ملفات التحميل"
        widget: list
        summary: "{{fields.label}}"
        fields:
          - name: label
            label: "اسم الملف كما يظهر"
            widget: string
          - name: url
            label: "الملف"
            widget: file
            hint: "ارفع الملف أو الصق مساره مثل /resources/bug-report-template.md"
      - name: tags
        label: "الوسوم"
        widget: list
        required: false
      - name: cover
        label: "صورة"
        widget: image
        required: false
      - name: featured
        label: "مورد مميّز يظهر أولاً"
        widget: boolean
        default: false
      - name: draft
        label: "مسودّة لا تُنشر"
        widget: boolean
        default: false
      - name: body
        label: "شرح المورد وكيفية استعماله"
        widget: markdown

  - name: news
    label: "آخر الأخبار"
    label_singular: "خبر"
    folder: src/content/news
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - name: title
        label: "عنوان الخبر"
        widget: string
      - name: slug
        label: "الرابط بالإنجليزي بدون مسافات"
        widget: string
        hint: "مثال: new-course-maestro"
      - name: description
        label: "الوصف المختصر"
        widget: text
        required: false
      - name: publishDate
        label: "تاريخ النشر"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - name: cover
        label: "صورة الخبر"
        widget: image
        required: false
      - name: pinned
        label: "تثبيت بأعلى الأخبار"
        widget: boolean
        default: false
      - name: draft
        label: "مسودّة لا تُنشر"
        widget: boolean
        default: false
      - name: body
        label: "نص الخبر"
        widget: markdown

  - name: questions
    label: "بنك أسئلة المقابلات"
    label_singular: "سؤال"
    folder: src/content/questions
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - name: title
        label: "نص السؤال"
        widget: string
      - name: slug
        label: "الرابط بالإنجليزي بدون مسافات"
        widget: string
        hint: "مثال: severity-vs-priority"
      - name: level
        label: "المستوى"
        widget: select
        default: "مبتدئ"
        options:
          - "مبتدئ"
          - "متوسط"
          - "متقدّم"
      - name: domain
        label: "المجال"
        widget: select
        default: "أساسيات"
        options:
          - "أساسيات"
          - "يدوي"
          - "أتمتة"
          - "API"
          - "أدوات"
          - "إدارة الاختبار"
          - "سلوكي"
      - name: shortAnswer
        label: "الجواب المختصر"
        widget: text
        hint: "سطر أو سطرين — هذا اللي بينكشف بوضع التدريب"
      - name: tags
        label: "الوسوم"
        widget: list
        required: false
      - name: relatedLessons
        label: "دروس تشرح الموضوع"
        widget: relation
        collection: lessons
        multiple: true
        search_fields:
          - title
        value_field: slug
        display_fields:
          - title
        required: false
      - name: draft
        label: "مسودّة لا تُنشر"
        widget: boolean
        default: false
      - name: body
        label: "الشرح الكامل"
        widget: markdown
        hint: "ليش بينسأل، جواب نموذجي، والفخ الشائع"

  - name: glossary
    label: "قاموس المصطلحات"
    label_singular: "مصطلح"
    folder: src/content/glossary
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - name: title
        label: "المصطلح بالعربي"
        widget: string
      - name: slug
        label: "الرابط بالإنجليزي بدون مسافات"
        widget: string
        hint: "مثال: regression"
      - name: termEn
        label: "المصطلح بالإنجليزي"
        widget: string
        required: false
        hint: "مثال: Regression Testing"
      - name: description
        label: "تعريف بسطر واحد"
        widget: text
      - name: category
        label: "المجال"
        widget: select
        default: "أساسيات"
        options:
          - "أساسيات"
          - "أنواع الاختبار"
          - "إدارة الاختبار"
          - "أتمتة"
          - "أدوات"
      - name: aliases
        label: "كلمات بديلة"
        widget: list
        required: false
        hint: "الكلمات اللي بتنربط تلقائياً بمتن الدروس — مثال: ريجريشن، الريجريشن، Regression"
      - name: related
        label: "مصطلحات مرتبطة"
        widget: relation
        collection: glossary
        multiple: true
        search_fields:
          - title
        value_field: slug
        display_fields:
          - title
        required: false
      - name: draft
        label: "مسودّة لا تُنشر"
        widget: boolean
        default: false
      - name: body
        label: "الشرح الكامل"
        widget: markdown

  - name: pages
    label: "الصفحات"
    label_singular: "صفحة"
    folder: src/content/pages
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - name: title
        label: "عنوان الصفحة"
        widget: string
      - name: slug
        label: "الرابط بالإنجليزي بدون مسافات"
        widget: string
        hint: "مثال: about — بيصير رابط الصفحة /about/"
      - name: description
        label: "الوصف المختصر"
        widget: text
        required: false
      - name: order
        label: "الترتيب"
        widget: number
        default: 1
        value_type: int
        min: 0
        required: false
      - name: draft
        label: "مسودّة لا تُنشر"
        widget: boolean
        default: false
      - name: profilePhoto
        label: "صورة بطاقة التعريف"
        widget: image
        required: false
        hint: "حطّ صورة لتظهر بطاقة تعريف جنب نص الصفحة. اتركها فاضية والصفحة بتضل بعمود واحد"
      - name: profileName
        label: "الاسم تحت الصورة"
        widget: string
        required: false
      - name: profileRole
        label: "المسمّى الوظيفي"
        widget: string
        required: false
        hint: "مثال: QA Engineer"
      - name: profileText
        label: "نبذة تحت الاسم"
        widget: text
        required: false
        hint: "اختياري — سطر أو سطرين. تقدر تضيفه أو تعدّله وقت ما بدك"
      - name: profileLink
        label: "رابط بالبطاقة"
        widget: string
        required: false
        hint: "اختياري — مثال: رابط لينكدإن"
      - name: profileLinkLabel
        label: "نص الرابط"
        widget: string
        required: false
        default: "لينكدإن"
      - name: body
        label: "محتوى الصفحة"
        widget: markdown
        hint: "تقدر تحط نصوص وصور وعناوين — وحتى كود تضمين فيديو"

  - name: settings
    label: "إعدادات الموقع"
    files:
      - name: site
        label: "إعدادات عامة"
        file: src/content/settings/site.json
        fields:
          - name: name
            label: "اسم الموقع"
            widget: string
          - name: logoTop
            label: "الشعار — السطر الأول"
            widget: string
          - name: logoBottom
            label: "الشعار — السطر الثاني"
            widget: string
          - name: tagline
            label: "الجملة التعريفية"
            widget: string
          - name: description
            label: "وصف الموقع لمحركات البحث"
            widget: text
          - name: url
