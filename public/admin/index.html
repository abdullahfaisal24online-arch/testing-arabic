<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>لوحة تحكم Testing بالعربي</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms@0.205.0/dist/sveltia-cms.js"></script>

    <!--
      أزرار إضافية بالقائمة الجانبية: «مراجعة التعليقات» و«طلبات المتجر».

      Sveltia CMS ما بتدعم إضافة روابط للقائمة رسمياً، فمنضيفهم بنسخ عنصر موجود
      ومنحطّهم بآخر القائمة. الكود دفاعي بالكامل: إذا تغيّر شكل اللوحة بأي تحديث،
      الأزرار بس ما بتظهر — ما بينكسر إشي باللوحة نفسها.
      زر المتجر بيظهر بس لما المتجر مفتوح بهاد البناء (/admin/store/count بيرجّع ok).
    -->
    <script>
      (function () {
        var LINKS = [
          { target: '/admin/comments', label: 'مراجعة التعليقات', icon: 'forum', mark: 'ta-comments-link', title: 'مراجعة تعليقات الزوار', count: '/admin/comments/count', always: true },
          { target: '/admin/store', label: 'طلبات المتجر', icon: 'shopping_cart', mark: 'ta-store-link', title: 'طلبات المتجر بانتظار المراجعة', count: '/admin/store/count', always: false },
        ];
        var storeOpen = null; // null = لسا ما عرفنا

        function group() {
          var sidebar = document.querySelector('.primary-sidebar');
          if (!sidebar) return null;
          var g = sidebar.querySelector('[role="listbox"] [role="group"] > .inner');
          return g && g.querySelector('button[role="option"]') ? g : null;
        }

        function build(sample, L) {
          var opt = sample.cloneNode(true);
          opt.setAttribute('data-' + L.mark, '1');

          var btn = opt.querySelector('button[role="option"]');
          if (!btn) return null;

          btn.removeAttribute('id');
          btn.removeAttribute('tabindex');
          btn.setAttribute('aria-selected', 'false');
          btn.setAttribute('value', L.label);
          btn.setAttribute('data-search-value', L.label);
          btn.setAttribute('data-label', L.label);
          btn.setAttribute('data-value', L.label);
          btn.setAttribute('title', L.title);

          var label = btn.querySelector('.label');
          if (label) label.textContent = L.label;

          var icons = btn.querySelectorAll('.sui.icon');
          if (icons.length) icons[0].textContent = L.icon;

          var count = btn.querySelector('.count');
          if (count) {
            count.textContent = '';
            count.style.display = 'none';
          }

          btn.addEventListener(
            'click',
            function (e) {
              e.preventDefault();
              e.stopPropagation();
              window.location.href = L.target;
            },
            true,
          );

          return opt;
        }

        // العدد المنتظر — الطلب بيمرّ من نفس بوابة Access
        function refreshCount(opt, L) {
          return fetch(L.count, { headers: { accept: 'application/json' } })
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .then(function (d) {
              if (!d || !d.ok) return d;
              var badge = opt && opt.querySelector('.count');
              if (!badge) return d;
              if (d.pending > 0) {
                badge.textContent = String(d.pending);
                badge.style.display = '';
              } else {
                badge.textContent = '';
                badge.style.display = 'none';
              }
              return d;
            })
            .catch(function () {
              return null;
            });
        }

        function injectOne(g, L) {
          if (g.querySelector('[data-' + L.mark + ']')) return;
          if (!L.always && storeOpen !== true) return;
          var sample = g.querySelector('button[role="option"]');
          sample = sample && sample.parentElement;
          if (!sample) return;
          var opt = build(sample, L);
          if (!opt) return;
          g.appendChild(opt);
          refreshCount(opt, L);
          setInterval(function () {
            if (document.body.contains(opt)) refreshCount(opt, L);
          }, 120000);
        }

        function inject() {
          try {
            var g = group();
            if (!g) return false;
            LINKS.forEach(function (L) {
              injectOne(g, L);
            });
            return true;
          } catch (err) {
            return false;
          }
        }

        // هل المتجر مفتوح؟ (مرة وحدة)
        refreshCount(null, LINKS[1]).then(function (d) {
          storeOpen = !!(d && d.ok);
          inject();
        });

        // اللوحة بتبني نفسها بعد ما تحمّل، وبتعيد بناء القائمة أحياناً —
        // فمنراقب ومنرجّع الأزرار إذا اختفت.
        var observer = new MutationObserver(function () {
          inject();
        });

        function start() {
          inject();
          observer.observe(document.body, { childList: true, subtree: true });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', start);
        } else {
          start();
        }
      })();
    </script>
  </body>
</html>
